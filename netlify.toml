[build]
  command = "npm run build"
  publish = "dist/card-jitsu/browser"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# Serve static assets and files directly (don't redirect through SSR)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*.js"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/*.css"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200

# All other routes go through Angular SSR
[[redirects]]
  from = "/*"
  to = "/.netlify/edge-functions/angular-ssr"
  status = 200