[build]
  command = "npm run build"
  publish = "dist/card-jitsu/browser"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/.netlify/edge-functions/angular-ssr"
  status = 200