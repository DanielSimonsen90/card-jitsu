<div *ngIf="isActive; then game else lobby"></div>

<ng-template #lobby>
  <div class="lobby">
    <main>
      <p class="conclusion" *ngIf="roundConclusionText">{{ roundConclusionText }}</p>
      <button class="brand primary" (click)="onStartGameClicked()">
        Start playing {{ SITE_NAME }}
      </button>
    </main>
    <aside>
      <playerlist />
    </aside>
  </div>
</ng-template>

<ng-template #game>
  <header class="game-header">
    <game-timer />
  </header>

  <section class="sub-header">
    <ul class="player-decks">
      <li *ngFor="let opponent of opponents">
        <player-deck [player]="opponent" [showContent]="false" />
      </li>
    </ul>
  </section>

  <section class="active-cards-container">
    <p class="conclusion" *ngIf="roundConclusionText">{{ roundConclusionText }}</p>
    <ul class="active-cards">
      <li *ngFor="let card of activeCards">
        <gamecard [card]="card" [showContent]="shouldShowActiveCardContent" />
      </li>
    </ul>
  </section>

  <footer>
    <player-deck />
  </footer>
</ng-template>
