<div *ngIf="isActive; then game else lobby"></div>

<ng-template #lobby>
  <div class="lobby">
    <main>
      <p class="conclusion" *ngIf="roundConclusionText">{{ roundConclusionText }}</p>
      <button class="brand primary" (click)="onStartGameClicked()">
        Start playing {{ SITE_NAME }}
      </button>
    </main>
    <aside>
      <playerlist />
    </aside>
  </div>
</ng-template>

<ng-template #game>
  <header class="game-header">
    <game-timer />
  </header>

  <section class="sub-header">
    <!-- Show current player deck at top if preference is 'top' -->
    <player-deck *ngIf="settingsStore.deck.locationPreference === 'top'" />
    
    <!-- Show opponent decks if preference is 'bottom' -->
    <ul class="player-decks" *ngIf="settingsStore.deck.locationPreference === 'bottom'">
      <li *ngFor="let opponent of opponents; trackBy: trackByPlayer">
        <player-deck [player]="opponent" [showContent]="false" />
      </li>
    </ul>
  </section>

  <section class="active-cards-container">
    <p class="conclusion" *ngIf="roundConclusionText">{{ roundConclusionText }}</p>
    <ul class="active-cards">
      <li *ngFor="let card of activeCards; trackBy: trackByCard">
        <gamecard [card]="card" [showContent]="shouldShowActiveCardContent" />
      </li>
    </ul>
  </section>

  <footer>
    <!-- Show current player deck at bottom if preference is 'bottom' -->
    <player-deck *ngIf="settingsStore.deck.locationPreference === 'bottom'" />
    
    <!-- Show opponent decks if preference is 'top' -->
    <ul class="player-decks" *ngIf="settingsStore.deck.locationPreference === 'top'">
      <li *ngFor="let opponent of opponents; trackBy: trackByPlayer">
        <player-deck [player]="opponent" [showContent]="false" />
      </li>
    </ul>
  </footer>
</ng-template>
