<div class="playerlist-container">
  <ul class="playerlist">
    <li *ngFor="let player of players" (click)="removePlayer(player)">{{player.name}}</li>
  </ul>
  <div class="button-container">
    <button class="secondary" (click)="onAddAiPlayerClicked()">
      Add AI player
    </button>
  </div>
</div>
